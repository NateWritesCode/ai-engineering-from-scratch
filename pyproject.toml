[project]
name = "ai-engineering-course"
version = "0.1.0"
description = "My environment for AI Engineering from Scratch, on aibox (ARM64, NVIDIA GB10)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=0.20",
    "anthropic>=0.25",
    "datasets>=2.14",
    "ipykernel>=7.4.0",
    "jupyter>=1.0",
    "librosa>=0.10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "tiktoken>=0.5",
    "tokenizers>=0.13",
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "transformers>=4.30",
]

# PyTorch for CUDA 13 on ARM64 comes from PyTorch's own index (PyPI only has CPU builds for ARM)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.uv]
package = false  # this is a course workspace, not a library to install
